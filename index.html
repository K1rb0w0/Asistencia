<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Asistencia</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #d90429;
      --primary-dark: #8d0801;
      --accent: #ffd166;
      --accent-neon: #06d6a0;
      --error-color: #ff4d4d;
      --bg-dark: #0f1423;
      --card-bg: rgba(26, 34, 56, 0.85);
      --text: #ffffff;
      --text-muted: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #202b4d 0%, var(--bg-dark) 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 209, 102, 0.25);
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(217, 4, 41, 0.15);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid var(--accent);
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .scanner-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.35);
      background: #000;
    }

    #reader { width: 100%; }
    #reader video { object-fit: cover !important; border-radius: 16px; }

    .btn-main {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 209, 102, 0.4);
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(217, 4, 41, 0.45);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(217, 4, 41, 0.6);
    }

    .status-card {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(15, 20, 35, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .status-card.loading {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(255, 209, 102, 0.1);
    }

    .status-card.success {
      color: var(--accent-neon);
      border-color: var(--accent-neon);
      background: rgba(6, 214, 160, 0.12);
      box-shadow: 0 0 12px rgba(6, 214, 160, 0.25);
    }

    .status-card.error {
      color: var(--error-color);
      border-color: var(--error-color);
      background: rgba(255, 77, 77, 0.15);
      box-shadow: 0 0 12px rgba(255, 77, 77, 0.25);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">Registro Digital</div>
    <h1>Control de Acceso</h1>
    <p class="subtitle">Presenta tu código QR frente al lector</p>

    <button id="btnStart" class="btn-main" onclick="iniciarCamara()">
      📷 Iniciar Lector
    </button>
    
    <div class="scanner-wrapper">
      <div id="reader"></div>
    </div>

    <div id="status" class="status-card">
      Presiona "Iniciar Lector" para activar el escáner
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLMlZ3yob-jbMIxDX2TJlYiXA0WKoFrx28d6Dua9574mWkehirYxosR7T0a5_4rYrp/exec";

    let html5QrCode = null;
    let procesando = false;

    // Función callback global para procesar la respuesta
    window.recibirRespuesta = function(res) {
      const status = document.getElementById('status');
      
      if (res.status === "ok") {
        status.className = "status-card success";
        status.innerText = "✅ Bienvenido/a: " + res.nombre;
      } else {
        status.className = "status-card error";
        status.innerText = "❌ No autorizado: QR no registrado";
      }

      setTimeout(() => {
        status.className = "status-card";
        status.innerText = "Listo para el siguiente registro...";
        procesando = false;
      }, 3000);
    };

    function iniciarCamara() {
      document.getElementById('btnStart').style.display = 'none';
      const status = document.getElementById('status');
      status.className = "status-card loading";
      status.innerText = "Encendiendo cámara...";

      html5QrCode = new Html5Qrcode("reader");

      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).then(() => {
        status.className = "status-card";
        status.innerText = "Listo. Apunta al código QR";
      }).catch(err => {
        status.className = "status-card error";
        status.innerText = "Error de cámara: " + err;
        document.getElementById('btnStart').style.display = 'inline-flex';
      });
    }

    function onScanSuccess(decodedText) {
      if (procesando) return;
      procesando = true;

      const status = document.getElementById('status');
      status.className = "status-card loading";
      status.innerText = "Validando código...";

      const scriptTag = document.createElement('script');
      const urlConParametros = SCRIPT_URL + 
        "?id=" + encodeURIComponent(decodedText) + 
        "&callback=recibirRespuesta" + 
        "&t=" + new Date().getTime();
      
      scriptTag.src = urlConParametros;
      scriptTag.onload = () => { if (scriptTag.parentNode) document.body.removeChild(scriptTag); };
      scriptTag.onerror = () => {
        status.className = "status-card error";
        status.innerText = "❌ Error de conexión al verificar";
        if (scriptTag.parentNode) document.body.removeChild(scriptTag);
        setTimeout(() => {
          status.className = "status-card";
          status.innerText = "Listo para el siguiente registro...";
          procesando = false;
        }, 3000);
      };

      document.body.appendChild(scriptTag);
    }
  </script>
</body>
</html>
